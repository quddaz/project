spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/woowapractice?serverTimezone=UTC}
    username: ${DB_USERNAME:woowapractice}
    password: ${DB_PASSWORD:woowapractice}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email
springdoc:
  api-docs:
    version: openapi_3_1
security:
  enabled: ${SECURITY_ENABLED:true}
grading:
  docker:
    image: ${GRADING_DOCKER_IMAGE:woowapractice/grader:java21}
    timeout-seconds: ${GRADING_TIMEOUT_SECONDS:120}
  worker:
    poll-ms: ${GRADING_WORKER_POLL_MS:1000}
